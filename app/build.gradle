dependencyLocking { lockAllConfigurations() }

// Fail on missing state only for the shipped variant and its relevant test classpaths.
// Other flavors/internal configurations retain Gradle's default locking behavior.
def requiredExperimentalLocks = [
    'experimentalDebugCompileClasspath', 'experimentalDebugRuntimeClasspath',
    'experimentalDebugUnitTestCompileClasspath', 'experimentalDebugUnitTestRuntimeClasspath',
    'experimentalDebugAndroidTestCompileClasspath', 'experimentalDebugAndroidTestRuntimeClasspath'
] as Set
configurations.configureEach { configuration ->
    if (requiredExperimentalLocks.contains(configuration.name)) {
        configuration.incoming.beforeResolve {
            if (!gradle.startParameter.writeDependencyLocks) {
                def state = file('gradle.lockfile')
                def present = state.isFile() && state.readLines('UTF-8').any { line ->
                    !line.startsWith('#') && line.contains('=') &&
                        line.substring(line.indexOf('=') + 1).split(',').contains(configuration.name)
                }
                if (!present) throw new GradleException("Missing dependency lock state for ${configuration.name}; regenerate selected locks offline without upgrading dependencies")
            }
        }
    }
}

