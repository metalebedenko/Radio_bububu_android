// Public clones use Android's standard debug signing. An existing identity is opt-in.
def localSigningPath = providers.gradleProperty('bububuSigningProperties').orNull
def localSigning = new Properties()
File localSigningFile = null
File localSigningStore = null
if (localSigningPath != null) {
    if (localSigningPath.trim().isEmpty()) throw new GradleException('bububuSigningProperties must name a properties file')
    localSigningFile = rootProject.file(localSigningPath).canonicalFile
    if (!localSigningFile.isFile()) throw new GradleException('Explicit signing properties file is missing')
    localSigningFile.withInputStream { localSigning.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
        if (localSigning.getProperty(name) == null || localSigning.getProperty(name).isEmpty()) {
            throw new GradleException("Explicit signing properties require ${name}")
        }
    }
    File requestedStore = new File(localSigning.getProperty('storeFile'))
    localSigningStore = (requestedStore.isAbsolute() ? requestedStore : new File(localSigningFile.parentFile, requestedStore.path)).canonicalFile
    if (!localSigningStore.isFile()) throw new GradleException('Explicit signing keystore is missing')
}
def internalQaId=providers.gradleProperty('bububuInternalQaApplicationId').orNull
def isolatedSetupQa=internalQaId!=null
if(providers.gradleProperty('bububuIsolatedSetupQa').orNull=='true'&&!isolatedSetupQa)throw new GradleException('A fresh job-specific bububuInternalQaApplicationId is required')
if(isolatedSetupQa&&!internalQaId.matches('ru\\.bububu\\.radio\\.internalqa45\\.j[a-z0-9]+'))throw new GradleException('Invalid job-specific QA applicationId')
android {
    namespace = 'ru.bububu.radio'
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    defaultConfig {
        applicationId = isolatedSetupQa ? internalQaId : 'ru.bububu.radio.test'
        minSdk = 26
        targetSdk = 36
        versionCode = 60
        versionName = '0.3-ux3'
        testInstrumentationRunner = isolatedSetupQa ? 'ru.bububu.radio.Unique45FixtureRunner' : 'androidx.test.runner.AndroidJUnitRunner'
    }
    if (localSigningFile != null) {
        signingConfigs {
            acceptedMain {
                storeFile = localSigningStore
                storePassword = localSigning.getProperty('storePassword')
                keyAlias = localSigning.getProperty('keyAlias')
                keyPassword = localSigning.getProperty('keyPassword')
            }
        }
        buildTypes { debug { signingConfig = signingConfigs.acceptedMain } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildFeatures { buildConfig = true }
    flavorDimensions += 'models'
    productFlavors {
        baseline { dimension 'models'; buildConfigField 'boolean', 'MODEL_EXPERIMENT', 'false' }
        experimental { dimension 'models'; minSdk = 28; versionNameSuffix '-models'; ndk { abiFilters 'arm64-v8a' }; buildConfigField 'boolean', 'MODEL_EXPERIMENT', 'true' }
    }
    packaging { jniLibs { useLegacyPackaging = false; keepDebugSymbols.add('**/*.so') } }

    lint { abortOnError = true; checkReleaseBuilds = true }
}
