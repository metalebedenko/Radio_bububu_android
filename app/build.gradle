static String sha256(File input) {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    return digest.digest().encodeHex().toString()
}

// Gradle's module verification does not cover local file dependencies or jniLibs.
def runtimePins = [
    '.private/vendor/pytorch/pytorch_android-2.1.0.aar': 'c1a5efebb598aaff1a80b3c40735615b9a5b83bc92f4729e2c53110b72b5f0c4',
    '.private/vendor/pytorch/fbjni-java-only-0.2.2.jar': '7904e1c270fc2efafa7232001fbd5adb0521f624ee3a6e548d1efbcb5f30bcdf',
    '.private/vendor/pytorch/nativeloader-0.10.5.jar': '971ded86009c0ac56fb2275e128f852e7dcbc41a40cd799688f8a1aebde5195d',
    '.private/vendor/sherpa/libs/sherpa-onnx-1.13.8.jar': '8af5aa647494ec9cb6596959d6d20864377cf4a9dedf1c1b178d936bfb7cea95',
    '.private/vendor/sherpa/jni/arm64-v8a/libonnxruntime.so': '33847ad43bffe204699fd4a27f7f3603452a8cdaf2f9a44983a0bc31ffcf2da1',
    '.private/vendor/sherpa/jni/arm64-v8a/libsherpa-onnx-jni.so': '3c6492ea91ea68fd3b72b9495efdde6dd913f6b58c387e3b07389cf335f4d26f'
]
def verifyRuntime = tasks.register('verifyExperimentalRuntimeInputs') {
    doLast {
        runtimePins.each { path, expected ->
            File input = rootProject.file(path)
            if (!input.isFile()) throw new GradleException("Missing experimental runtime input: ${path}")
            if (sha256(input) != expected) throw new GradleException("Experimental runtime SHA-256 mismatch: ${path}")
        }
    }
}
tasks.register('verifyBundledModelAssets') {
    doLast {
        def pins=['silero-accepted-v1.zip':[151435177L,'c97eeb96cd2b4e2806f056a515e2f2f48600041e59e9e70e812d274757c1587f'],
                  'gigaam-accepted-v1.zip':[231898104L,'3461c6dead251a85db28c6ca7edce083ccc5e72a4514092618d54f4fbe944df2']]
        pins.each { name,pin ->
            def file=new File(bundledStage,'bundled-models/'+name)
            if(!file.isFile() || file.length()!=pin[0])throw new GradleException('Missing exact private bundled pack: '+name)
            if(sha256(file)!=pin[1])throw new GradleException('Bundled pack hash mismatch: '+name)
        }
        ['NOTICE.txt','LICENSE.GigaAM-punct'].each { name ->
            if(!new File(bundledStage,'model-licenses/'+name).isFile())throw new GradleException('Missing bundled model notice: '+name)
        }
    }
}
tasks.configureEach {
    if (name in ['preExperimentalDebugBuild', 'preExperimentalReleaseBuild']) dependsOn(verifyRuntime)
    if (name == 'mergeExperimentalDebugAssets') dependsOn('verifyBundledModelAssets')
}
dependencies {
